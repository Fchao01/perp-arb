# entropy-arb strategy configuration / 策略配置
#
#   cp config.example.yaml config.yaml     then edit / 复制后修改
#
# This file IS the strategy. Credentials never live here — they go in .env
# (see .env.example). Every key is validated: a typo is a startup error, not
# a setting that silently does nothing.
# 本文件就是策略本身。密钥绝不放在这里（见 .env.example）。所有键名都会被校验：
# 拼写错误会直接报错，而不是静默失效。
#
# WHICH MARKETS to trade is NOT in this file — you state it explicitly on
# every start with command-line flags:
#     python3 main.py --symbol SNDK --primary entropy --hedge lighter-rh
# --primary selects the primary (default light-rh / RH); --hedge picks the other:
#   lighter      Lighter mainnet            (USDC, 0 bps taker)
#   lighter-rh   Lighter Robinhood chain    (USDG, 0 bps taker)
#   tradexyz     Hyperliquid trade.xyz dex  (USDC, ~1 bps taker)
# 交易哪个市场不在本文件中配置——每次启动时用命令行参数显式指定：
#     python3 main.py --symbol SNDK --primary entropy --hedge lighter-rh
# --primary 选择主腿（默认 light-rh / RH）；--hedge 选择对冲腿（默认 lighter）。
# 默认组合 / default pair: python3 main.py --symbol LIT
# 原 Entropy 组合 / legacy pair: --primary entropy --hedge lighter-rh
# 下文的 Entropy 信号公式均按所选主腿计算；更换组合后需重新采集和设定阈值。

# ============================ THE SIGNAL / 信号 ============================
# premium_bps = (Entropy price / hedge price - 1) * 10000
#
#   SELL entropy + BUY hedge   when executable premium >= midline + upper
#   BUY entropy + SELL hedge   when executable premium <= midline - lower
#
# Both hurdles are net of taker fees (the engine adds fees on top), so one
# full round trip nets >= upper + lower bps after fees by construction.
#
# midline_bps is a number YOU derive from recorded data. Run the bot
# (--record-only) to collect logs/sndk/minutes.csv, then:
#     python3 tools/analyze.py --csv logs/sndk/minutes.csv
#
# midline_bps 是你根据采集数据设定的值。先运行机器人（--record-only）采集
# logs/sndk/minutes.csv，再运行以下命令获取建议值（按实际品种替换 SNDK）：
#     python3 tools/analyze.py --csv logs/sndk/minutes.csv
# 两个方向的门槛都已扣除手续费（引擎会在此之上另加手续费），因此一次完整往返
# 扣费后净赚 >= upper + lower bps。
#
# midline_bps: auto follows the market instead: a time-weighted EMA of the
# live mid premium (time constant midline_window_min), seeded on start from
# the recorder's minute bars; no trades until midline_warmup_min of history.
# midline_bps: auto 让中枢跟随市场：实时中间价溢价的时间加权 EMA（时间常数
# midline_window_min），启动时用采集的分钟数据预热；历史不足
# midline_warmup_min 时不交易。
thresholds:
  midline_bps: 0.0     # persistent premium center, or auto / 溢价长期中枢，或 auto
  upper_bps: 4.0       # entry above midline: sell entropy / 中枢上方入场带宽
  lower_bps: 4.0       # entry below midline: buy entropy / 中枢下方入场带宽
  # midline_window_min: 60   # auto midline EMA time constant / 自动中枢时间常数（分钟）
  # midline_warmup_min: 10   # history before trading / 开始交易前需要的历史（分钟）

# ======================== VENUES / 交易所参数 ==============================
# Optional overrides for the selected primary venue. When --primary entropy,
# these override the legacy entropy section; otherwise entropy is ignored.
# 可选主腿参数；选 entropy 时覆盖下方旧配置，其他主腿不使用 entropy 段。
# primary:
#   taker_fee_bps: 0.0
#   max_position_usd: 1000
#   max_orders_per_min: 30

entropy:
  dex: io                    # Entropy's dex name on Hyperliquid / Entropy 的 dex 名
  taker_fee_bps: 0.0         # taker fee / 吃单手续费
  max_position_usd: 1000     # position cap / 持仓上限（美元）
  max_orders_per_min: 120    # order-send budget, sliding 60s / 每分钟下单预算

hedge:
  taker_fee_bps: 0.0         # Lighter venues: 0; tradexyz: ~1.0
  max_position_usd: 1000
  max_orders_per_min: 30     # Lighter's ceiling is ~40/min / Lighter 上限约 40/分钟

# ========================= SIZING / 下单规模 ===============================
sizing:
  take_fraction: 0.5           # fraction of crossable depth to take / 吃掉可套利深度的比例
  max_order_notional_usd: 500  # per-slice cap / 单笔名义上限
  min_order_notional_usd: 10   # skip dust / 低于此名义不下单

# ==================== INVENTORY LADDER / 库存阶梯 ==========================
# Extra bps required once a venue's position passes floor_frac of its cap in
# the adding direction — ramps linearly to scale_bps at 100% of the cap.
# Slows down one-sided accumulation without hard-stopping the strategy.
# 当某交易所持仓超过上限的 floor_frac 后，同方向继续加仓需额外溢价，线性增加到
# 满仓时的 scale_bps。避免单边持仓快速堆满。 scale_bps: 0 disables / 0 为关闭。
inventory:
  scale_bps: 10.0
  floor_frac: 0

# ======================= EXECUTION / 执行参数 ==============================
execution:
  premium_persist_sec: 0     # edge must persist this long before firing / 信号需持续时间
  cooldown_sec: 0.0            # min gap between executions / 两次执行的最小间隔
  settle_timeout_sec: 10.0      # wait for fill confirmation / 等待成交确认
  leg_slippage_bps: 50.0       # taker limit protection per leg / 每腿滑点保护
  hedge_slippage_bps: 20.0     # price protection on delta hedges / 对冲滑点保护
  # Sequential execution: send one leg first as a tight IOC limit and the
  # other leg only for what it filled. Use it when one venue's quotes are
  # picked off before your order lands (fills far worse than the book).
  # none = both legs at once; primary / hedge = that venue leads.
  # 顺序执行：先用紧限价 IOC 下一条腿，成交多少再在另一边下多少。适合某个交易所
  # 报价常在订单到达前就消失的情况。none = 两腿同时；primary / hedge = 该腿先下。
  lead_venue: none
  lead_slippage_bps: 0.0       # lead leg limit beyond the planned price / 先手腿允许的额外滑点
  net_tolerance_base: 0.001    # max tolerated net delta (base units) / 允许的净敞口
  max_consecutive_errors: 3    # halt after N straight failures / 连续失败 N 次后停机
  rate_limit_pause_sec: 10.0   # pause a 429'd venue this long / 被限频后的暂停时长
  staleness_sec: 10.0          # a feed older than this is stale / 行情超时判定
  reconcile_sec: 15.0          # on-chain position sync cadence / 链上持仓核对周期
  venue_probe_sec: 30.0        # probe cadence for a down venue / 故障交易所探测周期
  http_keepalive_sec: 10.0     # keep order-path TLS warm; 0 = off / 订单链路保活

# ===================== MAKER MODE / 挂单模式 ===============================
# Only used with  python3 main.py --mode maker ...  (the default taker mode
# ignores this section). Post-only quotes on the primary (RH) around
#     hedge_mid * (1 + center)  ±  half_spread_bps
# where center is an EMA of the RH/LIGHTER mid premium; every fill is hedged
# at once with a taker order on the hedge venue (LIGHTER).
# 仅在 --mode maker 时使用。以 LIGHTER 中间价加溢价中枢为基准，在 RH 双边挂
# post-only 单；每次成交立即在 LIGHTER 吃单对冲。
#
# Needs fast cancels: an RH account tier with 0 ms cancel latency and a high
# order-action limit (the shadow simulation lost ~3 bps/volume with 300 ms
# cancels and ~40 actions/min). Set max_actions_per_min below your tier's
# limit. Do not run another bot on the same accounts and market.
# 需要撤单 0 延迟、操作上限高的 RH 账户等级（普通账户模拟结果亏约 3bps）。
# max_actions_per_min 要低于账户等级的上限。同一账户同一市场不要再跑别的机器人。
maker:
  half_spread_bps: 3.0        # quote distance from ref, each side / 每边挂单距离
  quote_usd: 50               # size of each quote / 每笔挂单金额
  max_position_usd: 200       # stop quoting the side that adds beyond this / 单边仓位上限
  requote_bps: 1.0            # modify a quote once its target moved this much / 改单阈值
  max_actions_per_min: 600    # place + modify + cancel budget on RH / 每分钟操作上限
  center_window_sec: 900      # premium-center EMA time constant / 中枢时间常数
  center_warmup_sec: 300      # history before quoting (seeded from minutes.csv)
  maker_fee_bps: 0.0          # your real RH maker fee, for the edge accounting / 实际挂单费率

  # --- volatility guard: any trigger cancels both quotes for pause_sec
  # --- 行情剧烈时的保护：任一条件触发即撤掉双边挂单并暂停 pause_sec 秒
  move_window_sec: 10
  max_move_bps: 10            # LIGHTER mid moved more than this in move_window_sec
  long_move_window_sec: 120
  max_long_move_bps: 30       # ... or more than this in long_move_window_sec
  max_primary_move_bps: 15    # RH mid moved more than this in move_window_sec
  max_hedge_spread_bps: 5     # LIGHTER spread wider than this (no pause, just off)
  max_basis_dev_bps: 15       # premium this far from the center
  max_fills_per_min: 10       # one-way flow: more fills than this in 60 s
  pause_sec: 60
  # Weekday windows with no quoting, in blackout_tz (DST-aware). For US stock
  # perps keep the open and the close (and earnings) out:
  # 工作日禁止报价时段（按 blackout_tz，自动处理夏令时）。美股永续建议避开开盘和收盘：
  blackout_windows: []        # e.g. ["09:25-09:45", "15:55-16:45"]
  blackout_tz: America/New_York

  max_loss_usd: 5             # session mark-to-market loss that stops quoting for good / 止损
  dead_man_sec: 60            # exchange-side cancel-all if the bot stops refreshing (0 = off)
                              # note: it cancels resting orders in ALL markets of the RH account
                              # 交易所定时撤单：机器人停止刷新后自动撤掉 RH 账户所有市场的挂单
  fills_csv: logs/{symbol}/maker_fills.csv

# ================== DATA RECORDER / 数据采集 ===============================
# Always-on while the bot runs: samples both real order books 1/sec and
# writes one CSV row per minute. This is the input for tools/analyze.py.
# 机器人运行期间自动开启：每秒采样两边真实盘口，每分钟写一行 CSV，
# 供 tools/analyze.py 分析并设定上方 thresholds。
recorder:
  enabled: true
  # {symbol} is the lowercase --symbol, e.g. BTC -> logs/btc/minutes.csv.
  # 自动按小写币种建目录；旧固定路径也会自动插入币种目录。
  csv: logs/{symbol}/minutes.csv

# ==================== LOGGING & DASHBOARD / 日志与仪表盘 ====================
# On a terminal the bot shows a live Rich dashboard (books, signal, positions,
# PnL, recent executions); log lines then go to `file` instead of the console.
# Off-terminal runs (nohup/systemd) fall back to plain console logs
# automatically; --no-dashboard forces that.
# 在终端运行时显示实时 Rich 仪表盘（盘口、信号、持仓、盈亏、最近成交），
# 日志写入 `file` 而不再打印到屏幕。非终端环境（nohup/systemd）自动退回
# 纯日志模式；也可用 --no-dashboard 强制关闭。
logging:
  level: INFO
  status_interval_sec: 30.0
  # One row per corrective hedge, including realized close PnL.
  hedges_csv: logs/{symbol}/hedges.csv
  trades_csv: logs/{symbol}/trades.csv
  dashboard: true
  file: logs/{symbol}/engine.log
